name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # wrangler.jsonc 不進版控（含部署專屬值），CI 用範本跑 deploy --dry-run。
        run: |
          cp wrangler.jsonc.example wrangler.jsonc
          npm run build
